<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SORRY PERMANENTLY CLOSED</title>
    <style>
        /* Created by ChatGPT on 2025-01-13 */
        html {
            /* .sunlight scales past the viewport, so clip horizontal scroll here. */
            overflow: hidden;
        }
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #0077b6, #001f33);
            color: #fff;
            overflow: hidden;
            position: relative;
        }
        .container {
            text-align: center;
            position: relative;
            animation: fadeIn 2s ease-in-out;
        }
        h1.liquid-title {
            width: min(96vw, 1400px);
            margin: 0 auto 8px;
        }
        h1.liquid-title svg {
            display: block;
            width: 100%;
            height: auto;
            animation: glow 2s infinite alternate;
        }
        p {
            font-size: 1.2rem;
            margin: 20px 0;
            color: #cce7ff;
        }
        @keyframes glow {
            from {
                filter: drop-shadow(0 0 8px rgba(204, 231, 255, 0.45));
            }
            to {
                filter: drop-shadow(0 0 22px rgba(204, 231, 255, 0.9));
            }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .particle {
            position: absolute;
            top: 0;
            border-radius: 50%;
            opacity: 0;
            animation: float 5s linear infinite both;
            will-change: transform, opacity;
        }
        @keyframes float {
            0% {
                transform: translateY(100vh);
                opacity: 0;
            }
            15% {
                opacity: 0.8;
            }
            85% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100vh);
                opacity: 0;
            }
        }
        .sunlight {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at top, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0) 70%);
            opacity: 0.5;
            pointer-events: none;
            animation: sunlight 5s infinite alternate;
        }
        @keyframes sunlight {
            0% {
                transform: scale(1) translateY(0);
            }
            100% {
                transform: scale(1.1) translateY(-10%);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="liquid-title">
            <svg viewBox="105 0 790 70" role="img" aria-label="SORRY PERMANENTLY CLOSED">
                <defs>
                    <linearGradient id="waveGradient" gradientUnits="userSpaceOnUse" x1="0" y1="26" x2="0" y2="58">
                        <stop offset="0%" stop-color="#ffffff" />
                        <stop offset="100%" stop-color="#66c8ff" />
                    </linearGradient>

                    <!-- Seamless scrolling wave. Tile width 80 = wave period 20 * 4. -->
                    <pattern id="waveFill" x="0" y="0" width="80" height="70" patternUnits="userSpaceOnUse">
                        <g>
                            <!-- Slow vertical bob, so the liquid surface breathes. -->
                            <animateTransform attributeName="transform" type="translate"
                                              values="0,0;0,4;0,0" dur="4s" repeatCount="indefinite"
                                              calcMode="spline" keyTimes="0;0.5;1"
                                              keySplines="0.4 0 0.6 1;0.4 0 0.6 1" />
                            <path d="M-40 26 Q-30 21 -20 26 T0 26 T20 26 T40 26 T60 26 T80 26 T100 26 T120 26 V100 H-40 Z"
                                  fill="url(#waveGradient)">
                                <animateTransform attributeName="transform" begin="0s" dur="1.5s"
                                                  type="translate" from="0,0" to="40,0" repeatCount="indefinite" />
                            </path>
                        </g>
                    </pattern>
                </defs>

                <text x="500" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700"
                      font-size="48" fill="#ffffff" fill-opacity="0.15">SORRY PERMANENTLY CLOSED</text>

                <text x="500" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700"
                      font-size="48" fill="url(#waveFill)">SORRY PERMANENTLY CLOSED</text>
            </svg>
        </h1>
        <p id="url"></p>
        <h2>ขออภัยเพจนี้ปิดให้บริการถาวรแล้ว</h2>
    </div>

    <div class="sunlight"></div>

    <script>
        // Created by ChatGPT on 2025-01-13
        const urlParams = new URLSearchParams(window.location.search);
        const referrer = urlParams.get('ref') || document.referrer;
        document.getElementById('url').textContent = "URL: " + (referrer ? referrer : "");

        // Generate floating particles
        for (let i = 0; i < 100; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');

            // Mix of small and large bubbles. Bias toward small ones.
            const size = Math.random() < 0.7
                ? 3 + Math.random() * 4      // small: 3-7px
                : 8 + Math.random() * 10;    // large: 8-18px

            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDelay = Math.random() * 5 + 's';
            particle.style.animationDuration = 5 + Math.random() * 5 + 's';

            // Larger bubbles look softer / more distant.
            const alpha = size > 10
                ? 0.08 + Math.random() * 0.35
                : 0.3 + Math.random() * 0.7;
            particle.style.background = `rgba(255, 255, 255, ${alpha})`;
            particle.style.filter = size > 10 ? 'blur(1px)' : 'none';

            document.body.appendChild(particle);
        }
    </script>
</body>
</html>
